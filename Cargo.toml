[package]
name = "tg-md-msg"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.16.2"
napi-derive = "3.7.1"
pulldown-cmark = { version = "0.13.6", features = ["serde", "html"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
napi-build = "2.6.0"
